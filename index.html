<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Tracker | Talk Dygital</title>
</head>
<body style="margin:0;background:#071116;color:#edf7f5;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh">
  <div>Loading Lead Tracker...</div>
  <script>
    (async () => {
            const parts = ['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt','part-09.txt','part-10.txt','part-11.txt'];
      const html = (await Promise.all(parts.map(async path => {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load ${path}`);
        return response.text();
      }))).join('');
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      document.body.innerHTML = `<main style="max-width:680px;padding:24px"><h1>Lead Tracker could not load</h1><p>${error.message}</p></main>`;
    });
  </script>
</body>
</html>
